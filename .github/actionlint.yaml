# actionlint settings (run locally: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12).
paths:
  .github/workflows/deploy.yml:
    ignore:
      # The deploy job reads this secret from its GitHub environment. Declaring it under on.workflow_call.secrets, which
      # would satisfy actionlint, makes it resolve to an empty string, because the caller never passes it (PF-027).
      - 'property "render_deploy_hook_url" is not defined'

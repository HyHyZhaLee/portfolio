name: frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", "backend/openapi/openapi.json", ".nvmrc", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "backend/openapi/openapi.json", ".nvmrc", ".github/workflows/frontend.yml"]
  # Rebuilds production by hand, for example after VITE_API_URL changes in the Vercel settings (PF-013 D4).
  workflow_dispatch:

permissions:
  contents: read

# A newer run cancels an older one only on pull requests; a deploy on main is never stopped halfway (PF-013 D5).
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API types match the OpenAPI snapshot
        run: pnpm gen:api && git diff --exit-code -- src/api/schema.d.ts
      - run: pnpm check:type
      - run: pnpm check:lint
      - run: pnpm check:format
      - run: pnpm coverage
      - run: pnpm build

  # Production deploy, only after every check passed (PF-013 D1). Vercel's own Git deploys are off in frontend/vercel.json.
  # The CLI runs from the repository root because the Vercel project's Root Directory is already frontend (PF-013 D3).
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      # The token goes only to the vercel commands, never to the job environment that install scripts can read.
      - run: npm install --global vercel@66.2.0
      - name: Pull the production settings and environment variables
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build with the commands in frontend/vercel.json
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy the build to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

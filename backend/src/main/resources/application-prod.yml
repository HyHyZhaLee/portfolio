# Render. DB_URL, DB_USERNAME, and DB_PASSWORD come from the Render environment (application.yml gives them no default).
logging:
  structured:
    format:
      console: ecs # one JSON object per line
    ecs:
      service:
        version: ${RENDER_GIT_COMMIT:local} # the deployed commit, instead of the Gradle 0.0.1-SNAPSHOT (PF-027 P16)

# Shared settings. Connection settings come from environment variables with no default here:
# application-local.yml supplies the developer-machine defaults, tests use Testcontainers, and Render sets them.
server:
  port: ${PORT:8080} # Render injects PORT
  request:
    header:
      forwarded:
        # ClientInfoResolver reads X-Forwarded-For itself and trusts only the proxy's entry (PF-004 P7); `framework`
        # would trust the leftmost, client-supplied entry and remove the header.
        strategy: none
  tomcat:
    use-relative-redirects: true # keeps Swagger UI's redirect relative behind Render's TLS proxy
spring:
  application:
    name: portfolio
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 3 # 512 MB of RAM and Neon's free connection limits
      data-source-properties:
        # PostgreSQL's "Failing row contains ..." detail would put a contact message's personal data into an exception
        # message and a log line (PF-006 P14, Non-Negotiable 9).
        logServerErrorDetail: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema (Non-Negotiable 6)
  threads:
    virtual:
      enabled: true
  jackson:
    factory:
      constraints:
        read:
          # Public JSON bodies stay well under it: the largest, a contact message, is about 32 KB at most (a 10,000-character
          # message at 3 UTF-8 bytes per character, plus the other fields; PF-028). The cap stops parsing an oversized body before binding,
          # validation, and the rate limit, so it cannot fill the heap; it answers 400 VALIDATION_FAILED (PF-005).
          max-document-length: 65536
  # spring.mvc.problemdetails stays off: Boot's handler puts framework text in `detail` (Non-Negotiable 5).
  # PF-004's GlobalExceptionHandler writes the problem responses instead.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always # component statuses (db UP/DOWN), never their details
  info:
    env:
      enabled: true # publishes the info.* properties below, and nothing else
info:
  app:
    commit: ${RENDER_GIT_COMMIT:local} # the deployed commit; the PF-027 deploy job waits for it
    environment: ${app.environment}
app:
  environment: ${APP_ENVIRONMENT:production} # staging sets APP_ENVIRONMENT=staging (PF-027 P15)
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:} # required outside the local profile (startup fails when empty)
  client:
    visitor-hash-secret: ${VISITOR_HASH_SECRET:} # required outside the local profile
    trusted-proxy-hops: ${TRUSTED_PROXY_HOPS:1}
    log-forwarded-for-once: ${LOG_FORWARDED_FOR_ONCE:false} # PF-004 D3: on for one deploy in PF-012, then off
  stats:
    cache-ttl: ${STATS_CACHE_TTL:60s} # how old the stats summary may be (PF-005 FR-9)
  contact:
    retry-enabled: ${CONTACT_RETRY_ENABLED:true} # the scheduled resend of FAILED messages (PF-006 FR-9)
    resend: # bound outside the local profile only, which logs instead of sending (PF-006 D14)
      environment: ${app.environment} # marks emails sent outside production (PF-027 P15)
      api-key: ${RESEND_API_KEY:} # required outside the local profile (startup fails when empty)
      to-email: ${CONTACT_TO_EMAIL:} # required outside the local profile: the owner's inbox
      from-email: ${CONTACT_FROM_EMAIL:Portfolio <onboarding@resend.dev>} # an address on a verified domain later
  github: # the projects list (PF-007); base-url, timeouts, and circuit-open-for default in GitHubProperties
    username: ${GITHUB_USERNAME:HyHyZhaLee}
    token: ${GITHUB_TOKEN:} # optional in every profile: only raises GitHub's rate limit from 60 to 5,000 an hour (PF-007 D8)
    featured: ${GITHUB_FEATURED:BK2023_Thesis_SmartPole,portfolio} # listed first, in this order
    cache-ttl: ${GITHUB_CACHE_TTL:1h} # how long a successful list is served (SITE-005)
logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
springdoc:
  writer-with-order-by-keys: true # deterministic snapshot
  api-docs:
    enabled: true # public on purpose: the README links Swagger UI
  swagger-ui:
    enabled: true
